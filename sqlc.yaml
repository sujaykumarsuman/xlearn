# sqlc config (ADR-0005): type-safe Go from hand-written SQL, pgx/v5 driver, no ORM.
# Generated output is committed; CI runs `sqlc diff` to keep it in sync. One block
# per service schema as services adopt the platform; identity is the first.
version: "2"
sql:
  - engine: "postgresql"
    # schema.sql declares the (infra-provisioned) identity schema for analysis;
    # the migrations dir supplies the tables. goose only ever reads the latter.
    schema:
      - "internal/identity/store/schema.sql"
      - "internal/identity/store/migrations"
    queries: "internal/identity/store/queries"
    gen:
      go:
        package: "gen"
        out: "internal/identity/store/gen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: false
        emit_empty_slices: true
