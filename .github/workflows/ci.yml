name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web run test
      - run: npm --prefix web run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Build the SPA first so //go:embed web/dist has real assets to embed.
      - run: npm --prefix web ci && npm --prefix web run build
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The default lane (no build tag) runs unit tests + the OpenAPI drift check
      # (internal/gateway/openapi_drift_test.go), which keeps openapi.yaml in sync with
      # the gateway route table. The real-broker e2e is tagged `e2e` and runs separately.
      - run: go test -race ./...
      # sqlc-generated code is committed; verify it is in sync (ADR-0005).
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff

  # Public content checks (m1-09; t1 §7.2): cmd/contentlint over curriculum/ (schema +
  # strict decode, id/slug guards vs ids.lock.json and the previous release tag — hence
  # fetch-depth 0 —, the Markdown profile, filename rules, the embedded-file allowlist),
  # then the seeded-row snapshot and the loader/re-seed/migration tests on PG 18 under
  # the least-privilege curriculum role.
  content:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xlearndb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: contentlint
        run: make contentlint
      - name: Curriculum role + schema (least privilege, the CNPG model)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -d xlearndb \
            -c "CREATE ROLE xlearn_curriculum LOGIN PASSWORD 'pw'" \
            -c "CREATE SCHEMA curriculum AUTHORIZATION xlearn_curriculum" \
            -c "ALTER ROLE xlearn_curriculum SET search_path = curriculum"
      - name: Seeded-row snapshot (TestSeedMatchesV1Snapshot)
        env:
          XLEARN_TEST_DATABASE_URL: postgres://xlearn_curriculum:pw@localhost:5432/xlearndb?sslmode=disable
        run: go test -race -count=1 -run TestSeedMatchesV1Snapshot -v ./internal/curriculum/
      # -p 1: every curriculum DB test starts from a fresh schema in the same database.
      - name: Curriculum loader, re-seed and migration tests
        env:
          XLEARN_TEST_DATABASE_URL: postgres://xlearn_curriculum:pw@localhost:5432/xlearndb?sslmode=disable
        run: go test -race -count=1 -p 1 ./internal/curriculum/... ./internal/course/... ./cmd/contentlint/

  # Core-loop e2e over REAL JetStream + the transactional outbox (events.md Flows 1-4).
  # NATS runs IN-PROCESS (an embedded nats-server with JetStream), so the job needs only
  # a Postgres — the outbox → relay → JetStream → durable-consumer path is the production
  # one, nothing is mocked. The test is behind the `e2e` build tag + gated on the DB URL,
  # so it never compiles or runs in the default `go` lane above.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xlearndb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Every internal/*/store integration test on the production Postgres major (PG 18),
      # each under a least-privilege role that owns only its schema (the CNPG model), in
      # its own database so it never shares state with the e2e below. Catches the next
      # major bump in CI, not in prod.
      - name: Store integration tests (PG 18, least-privilege role per schema)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -d xlearndb -c "CREATE DATABASE xlearn_store"
          for s in identity curriculum practice review assessment coach; do
            psql -v ON_ERROR_STOP=1 -d xlearn_store \
              -c "CREATE ROLE xlearn_$s LOGIN PASSWORD 'pw'" \
              -c "CREATE SCHEMA $s AUTHORIZATION xlearn_$s" \
              -c "ALTER ROLE xlearn_$s SET search_path = $s"
          done
          for s in identity curriculum practice review assessment coach; do
            XLEARN_TEST_DATABASE_URL="postgres://xlearn_$s:pw@localhost:5432/xlearn_store?sslmode=disable" \
              go test -race -count=1 "./internal/$s/store/"
          done
      - name: Core-loop e2e (real embedded NATS JetStream + outbox)
        env:
          XLEARN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/xlearndb?sslmode=disable
        run: go test -tags e2e -race -count=1 ./internal/e2e/...
