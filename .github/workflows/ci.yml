name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web run test
      - run: npm --prefix web run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Build the SPA first so //go:embed web/dist has real assets to embed.
      - run: npm --prefix web ci && npm --prefix web run build
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The contract-header migration lint (m1-02, ADR-0034 §3): its self-tests, then every
      # goose migration newer than v1.5.2 (hack/migrations-baseline.txt). POSIX sh + awk.
      - name: Migration lint (xlearn:contract / xlearn:relax)
        run: |
          sh hack/lint-migrations.sh --self-test
          sh hack/lint-migrations.sh
      # M1b gates (m1-03): no DSA slug literal outside the allowlist in internal/ and
      # web/src/ (course.DefaultSlug is the one spelling), and no query on an M1c-drop
      # column or the retired (account_id, week_of) conflict target (m1-08 reuses it).
      - name: Course-literal gate
        run: |
          sh hack/lint-course-literals.sh --self-test
          sh hack/lint-course-literals.sh
      - name: Dropped-column gate
        run: |
          sh hack/lint-dropped-columns.sh --self-test
          sh hack/lint-dropped-columns.sh
      # L6 (m1-05, ADR-0035 §4): no raw request-body read, uncapped proxy body or
      # json.NewDecoder(r.Body) in internal/gateway (reads also in internal/platform) —
      # bodies go through httpx.ReadBody / http.MaxBytesReader for the typed 413.
      - name: Request-body gate
        run: |
          sh hack/lint-bodies.sh --self-test
          sh hack/lint-bodies.sh
      # The default lane (no build tag) runs unit tests + the OpenAPI drift check
      # (internal/gateway/openapi_drift_test.go), which keeps openapi.yaml in sync with
      # the gateway route table. The real-broker e2e is tagged `e2e` and runs separately.
      - run: go test -race ./...
      # sqlc-generated code is committed; verify it is in sync (ADR-0005).
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff

  # Public content checks (m1-09, m3-01; t1 §7.2): cmd/contentlint over curriculum/
  # (schema + strict decode, id/slug guards vs ids.lock.json and the previous release tag —
  # hence fetch-depth 0 —, the t4 §5.6 structure lints, the hints/editorial stamp gate and
  # the label-edit flag against the PR base, the Markdown profile, filename rules, the
  # repo-wide pack-artefact pass, the embedded-file allowlists), then the seeded-row
  # snapshot and the loader/re-seed/migration tests on PG 18 under the least-privilege
  # curriculum role. packlint's fingerprint scan never runs here (it needs the private pack).
  content:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xlearndb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The diff gates compare against the PR's base (HEAD^1 of the merge ref) or the
      # push's previous head. The PR body (label-edit-ok: <item>/<part>/<id>) is read at
      # run time, so re-running the job after editing the body picks the edit up.
      - name: contentlint
        env:
          CONTENTLINT_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            CONTENTLINT_PR_BODY=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""') || CONTENTLINT_PR_BODY=$EVENT_PR_BODY
            export CONTENTLINT_PR_BODY
          fi
          make contentlint
      - name: Curriculum role + schema (least privilege, the CNPG model)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -d xlearndb \
            -c "CREATE ROLE xlearn_curriculum LOGIN PASSWORD 'pw'" \
            -c "CREATE SCHEMA curriculum AUTHORIZATION xlearn_curriculum" \
            -c "ALTER ROLE xlearn_curriculum SET search_path = curriculum"
      - name: Seeded-row snapshot (TestSeedMatchesV1Snapshot)
        env:
          XLEARN_TEST_DATABASE_URL: postgres://xlearn_curriculum:pw@localhost:5432/xlearndb?sslmode=disable
        run: go test -race -count=1 -run TestSeedMatchesV1Snapshot -v ./internal/curriculum/
      # -p 1: every curriculum DB test starts from a fresh schema in the same database.
      - name: Curriculum loader, re-seed and migration tests
        env:
          XLEARN_TEST_DATABASE_URL: postgres://xlearn_curriculum:pw@localhost:5432/xlearndb?sslmode=disable
        run: go test -race -count=1 -p 1 ./internal/curriculum/... ./internal/course/... ./internal/packspec/... ./cmd/contentlint/ ./cmd/packlint/

  # The SYNTHETIC fixture pack through the whole eval-pack pipeline (m3-02; t1 §3.7, §7.2):
  # check → lock --verify → validate → exec --gate all → build + diff against the committed
  # internal/judge/testdata/pack → listing (the directory, a locally built image, and a planted
  # gen/ file that must fail). Every program runs in a network-less container through packlint's
  # executor (docker is on the runner); no secrets. The fixture's wrong solutions (WA, TLE, RE)
  # must fail as declared. The Go std-cache seed volume is restored from actions/cache, keyed by
  # the pinned golang image digest and the seed recipe.
  pack-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      C: internal/judge/testdata/content
      S: internal/judge/testdata/packsrc
      FIXTURE_SHA: "0000000000000000000000000000000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build packlint
        run: go build -o "$RUNNER_TEMP/packlint" ./cmd/packlint
      - name: Seed cache key (golang image digest + seed recipe)
        id: seed
        run: |
          img=$(sed -n 's/^\tGoImage *= *"\(.*\)"$/\1/p' internal/packspec/executor/executor.go)
          recipe=$(sed -n 's/^const SeedRecipe = "\(.*\)"$/\1/p' internal/packspec/executor/executor.go)
          test -n "$img" && test -n "$recipe"
          echo "key=packlint-gocache-${{ runner.arch }}-${img##*@sha256:}-${recipe}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/packlint-cache
          key: ${{ steps.seed.outputs.key }}
      - name: Warm the std cache (restored, or built once and saved)
        run: '"$RUNNER_TEMP/packlint" exec --warm-cache --cache-dir "$RUNNER_TEMP/packlint-cache"'
      - name: packlint check
        run: '"$RUNNER_TEMP/packlint" check --public "$C" --pack "$S"'
      - name: packlint lock --verify (reproducibility)
        run: '"$RUNNER_TEMP/packlint" lock --public "$C" --pack "$S" --verify'
      - name: packlint validate (generic + custom validators, invalid inputs rejected)
        run: '"$RUNNER_TEMP/packlint" validate --public "$C" --pack "$S"'
      - name: packlint exec --gate all (syntax, oracle, wrong solutions, provisional TL)
        run: '"$RUNNER_TEMP/packlint" exec --public "$C" --pack "$S" --gate all --provisional'
      - name: packlint build, then diff against the committed pack
        run: |
          "$RUNNER_TEMP/packlint" build --public "$C" --pack "$S" --out "$RUNNER_TEMP/pack" \
            --version 0.1.0 --validated-against "$FIXTURE_SHA" --dockerfile=false
          diff -r "$RUNNER_TEMP/pack" internal/judge/testdata/pack
      - name: packlint listing (directory, image, planted gen/ file)
        run: |
          P="$RUNNER_TEMP/packlint"
          "$P" listing internal/judge/testdata/pack
          "$P" build --public "$C" --pack "$S" --out "$RUNNER_TEMP/image" --version 0.1.0 --validated-against "$FIXTURE_SHA"
          docker build -q -t xlearn-evalpack-fixture:ci "$RUNNER_TEMP/image"
          "$P" listing xlearn-evalpack-fixture:ci
          cp -R internal/judge/testdata/pack "$RUNNER_TEMP/planted"
          mkdir -p "$RUNNER_TEMP/planted/courses/fixture/items/fx-001/gen"
          echo 'package main' > "$RUNNER_TEMP/planted/courses/fixture/items/fx-001/gen/planted.go"
          # The negative control's expected failure lines stay out of the log (no error annotations).
          if "$P" listing "$RUNNER_TEMP/planted" >/dev/null; then echo "::error::a planted gen/ file passed the listing test"; exit 1; fi
          echo "listing negative control: the planted gen/ file failed, as it must"

  # NATS-auth integration test (mi-05, ADR-0035 §2 "Verification before any seed is
  # mounted"): boots the prod minor (nats:2.14, deploy/local/nats-acl.compose.yml) with
  # the authorization block rendered from topology.go for throwaway nkeys, then drives
  # the real client code through every allowed/denied case for the 6 services + ops and
  # the three legacy stages (N1 allow, N3 deny, N4 none). The golden render itself is
  # pinned in the `go` job (TestACLGolden), so a stale golden fails there.
  nats-acl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make nats-acl-test

  # The runner's Linux jail suite (m3-03, ADR-0030; build tag runner_it): the hostile corpus
  # (MLE 100/100 with 0 container OOMs, TLE / TLE (idle) / OLE / RE, SIGSYS → signal + rotation,
  # every network probe fails), the cleanup invariants over 1,000 case cgroups, the L14 caps and
  # the API contract, against the real runner binary. The job container is the runner image's
  # base (debian:trixie-slim, m3-15), privileged with a private cgroup namespace and the pod's
  # limits (2 CPUs, 3 GiB), so "0 container OOMs" means what it says. It stands in for a local
  # privileged VM run. It does NOT exercise the pod's user namespace, the Localhost AppArmor and
  # pod seccomp profiles or the VAP: m3-15's VM rehearsal and mi-10 cover those.
  # m3-04 adds the launch profiles (go@1.26, cpp@g++14, python@3.13: references and wrong
  # solutions in all three languages, the evasion fixtures, the GOCACHE seed built with
  # `runner seed-gocache`, the provisional TL multipliers as RUNNER-IT-METRIC lines) and the
  # public content check (curriculum/ starters and references). g++ and python3 come from trixie,
  # like the image; a patch may differ from the image's, so this lane is functional and m3-15's
  # in-image run is authoritative. The job has no path filter: it runs on every push and PR,
  # curriculum/** included.
  runner-it:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
      options: --privileged --cgroupns=private --memory=3g --cpus=2
    env:
      GO_VERSION: "1.26.8"
      GO_SHA256: "d0f743b33e8d8945e6b1f432edd15785c70507121d6e2a723b21285eddf8b57b"
    steps:
      - name: Base packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git make g++ python3 >/dev/null
          g++ --version | head -1
          python3 -VV
      - uses: actions/checkout@v4
      - name: Pinned Go tarball (checksummed)
        run: |
          curl -fsSL -o /tmp/go.tgz "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  /tmp/go.tgz" | sha256sum -c -
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
      - name: Jail environment
        run: |
          uname -r
          id -u
          cat /sys/fs/cgroup/cgroup.controllers /sys/fs/cgroup/memory.max /sys/fs/cgroup/cpu.max
      - name: runner-it
        run: make runner-it

  # Does this push or PR touch what goes into the runner image? (m3-15's two image lanes below.)
  # The plan's paths (deploy/runner*, cmd/runner, internal/runner, the runner API, curriculum/),
  # plus what else is compiled into the binary (the harness templates, go.mod/go.sum) and the
  # lanes' own workflow files.
  runner-paths:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.f.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "runner=true" >> "$GITHUB_OUTPUT"; echo "no usable base: run the runner lanes"; exit 0
          fi
          re='^(deploy/runner|cmd/runner/|internal/runner/|internal/platform/runnerapi/|internal/platform/harness/|curriculum/|go\.mod$|go\.sum$|\.github/workflows/(ci|runner-release)\.yml$)'
          if git diff --name-only "$BASE" HEAD | grep -qE "$re"; then
            echo "runner=true" >> "$GITHUB_OUTPUT"
          else
            echo "runner=false" >> "$GITHUB_OUTPUT"
          fi

  # Reproducibility (m3-15 task 3): two --no-cache builds of the runner image on the ONE pinned
  # BuildKit image (the same as runner-release.yml) with the release's output settings must give
  # the same OCI manifest digest. On a mismatch, a pinned diffoci names the differing files; fix
  # the cause, never relax the check.
  runner-repro:
    needs: runner-paths
    if: needs.runner-paths.outputs.runner == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Two clean builds
        id: builds
        run: |
          sde=$(git log -1 --format=%ct)
          for n in 1 2; do
            docker buildx build --no-cache -f deploy/runner.Dockerfile --platform linux/amd64 \
              --build-arg VERSION=runner-ci --build-arg REVISION="$GITHUB_SHA" --build-arg SOURCE_DATE_EPOCH="$sde" \
              --provenance=false --sbom=false \
              --output "type=oci,dest=$RUNNER_TEMP/b$n.tar,name=xlearn-runner:repro$n,oci-mediatypes=true,compression=gzip,compression-level=9,force-compression=true" .
            mkdir -p "$RUNNER_TEMP/b$n" && tar -C "$RUNNER_TEMP/b$n" -xf "$RUNNER_TEMP/b$n.tar" index.json
            echo "d$n=$(jq -r '.manifests[0].digest' "$RUNNER_TEMP/b$n/index.json")" >> "$GITHUB_OUTPUT"
          done
          ls -l "$RUNNER_TEMP"/b*.tar
      - name: Same manifest digest
        env:
          D1: ${{ steps.builds.outputs.d1 }}
          D2: ${{ steps.builds.outputs.d2 }}
        run: |
          echo "build 1: $D1"; echo "build 2: $D2"
          { echo "### runner-repro"; echo; echo "- build 1: \`$D1\`"; echo "- build 2: \`$D2\`"; echo "- BuildKit: \`$BUILDKIT_IMAGE\`"; } >> "$GITHUB_STEP_SUMMARY"
          test "$D1" = "$D2"
      - uses: actions/setup-go@v5
        if: failure()
        with:
          go-version-file: go.mod
      - name: diffoci (on a mismatch)
        if: failure()
        run: |
          go install github.com/reproducible-containers/diffoci/cmd/diffoci@v0.1.8
          # The name= in the OCI output (an index.json annotation; the manifest digest doesn't move)
          # lets the classic docker image store load the archive.
          for n in 1 2; do docker load -i "$RUNNER_TEMP/b$n.tar"; done
          "$(go env GOPATH)/bin/diffoci" diff docker://xlearn-runner:repro1 docker://xlearn-runner:repro2 || true

  # The authoritative in-image run (m3-15 task 3; t1 §7.2's "in the public production runner
  # image"): build the image on the pinned BuildKit, check its rootfs (no setuid/setgid file, no
  # secret, no eval-pack path), run it like the pod's limits in dev mode — privileged, private
  # cgroupns, 3 GiB, 2 CPUs, --restart=always because the runner exits on purpose after a SIGSYS —
  # then the acceptance suite SUBSET=full (A–H: m3-04's references and public content check run
  # inside the image's toolchains) with CALIBRATE=1 (the TL-baselines doc's CI column). Privileged
  # containers are CI and compose only; production never runs privileged (the VAP forbids it).
  runner-image-acceptance:
    needs: runner-paths
    if: needs.runner-paths.outputs.runner == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build the image (the release's settings)
        id: build
        run: |
          docker buildx build -f deploy/runner.Dockerfile --platform linux/amd64 \
            --build-arg VERSION=runner-ci --build-arg REVISION="$GITHUB_SHA" --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            --provenance=false --sbom=false \
            --output "type=oci,dest=$RUNNER_TEMP/runner.tar,name=xlearn-runner:ci,oci-mediatypes=true,compression=gzip,compression-level=9,force-compression=true" .
          mkdir -p "$RUNNER_TEMP/oci" && tar -C "$RUNNER_TEMP/oci" -xf "$RUNNER_TEMP/runner.tar" index.json
          digest=$(jq -r '.manifests[0].digest' "$RUNNER_TEMP/oci/index.json")
          # name= (an index.json annotation; the manifest digest doesn't move) lets the classic
          # docker image store load the OCI archive as xlearn-runner:ci.
          docker load -i "$RUNNER_TEMP/runner.tar"
          docker image inspect xlearn-runner:ci --format '{{.Id}}'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image digest $digest, compressed $(du -h "$RUNNER_TEMP/runner.tar" | cut -f1)"
      - name: Rootfs check (setuid/setgid, secrets, eval-pack paths)
        run: |
          mkdir "$RUNNER_TEMP/rootfs"
          docker create --name rootfs xlearn-runner:ci >/dev/null
          docker export rootfs | tar -C "$RUNNER_TEMP/rootfs" -xf -
          docker rm rootfs >/dev/null
          sh deploy/runner-rootfs-check.sh "$RUNNER_TEMP/rootfs"
      - name: Start the runner (dev mode, the pod's limits)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # A CI-only token, generated per run; never used outside this job.
          head -c 24 /dev/urandom | base64 | tr -d '\n=' > "$RUNNER_TEMP/token"
          chmod 0444 "$RUNNER_TEMP/token"
          docker run -d --name runner --restart=always --privileged --cgroupns=private --memory=3g --cpus=2 \
            -e RUNNER_MODE=dev -e RUNNER_TOKEN_FILE=/run/xl/token -e RUNNER_IMAGE_DIGEST="$DIGEST" \
            -v "$RUNNER_TEMP/token:/run/xl/token:ro" -p 127.0.0.1:18090:8090 xlearn-runner:ci
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:18090/readyz; then echo; break; fi
            sleep 2
          done
          uname -r
      - name: Acceptance suite (SUBSET=full, CALIBRATE=1)
        run: make runner-acceptance RUNNER_URL=http://127.0.0.1:18090 RUNNER_TOKEN_FILE="$RUNNER_TEMP/token" SUBSET=full CALIBRATE=1
      - name: Report
        if: always()
        run: |
          for f in bin/runner-acceptance-*.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          docker logs runner 2>&1 | tail -n 200 > bin/runner-container.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runner-acceptance-report
          path: |
            bin/runner-acceptance-*.json
            bin/runner-acceptance-*.md
            bin/runner-container.log
          retention-days: 7
          if-no-files-found: warn

  # Core-loop e2e over REAL JetStream + the transactional outbox (events.md Flows 1-4).
  # NATS runs IN-PROCESS (an embedded nats-server with JetStream), so the job needs only
  # a Postgres — the outbox → relay → JetStream → durable-consumer path is the production
  # one, nothing is mocked. The test is behind the `e2e` build tag + gated on the DB URL,
  # so it never compiles or runs in the default `go` lane above.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xlearndb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Every internal/*/store integration test on the production Postgres major (PG 18),
      # each under a least-privilege role that owns only its schema (the CNPG model), in
      # its own database so it never shares state with the e2e below. Catches the next
      # major bump in CI, not in prod.
      - name: Store integration tests (PG 18, least-privilege role per schema)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -d xlearndb -c "CREATE DATABASE xlearn_store"
          for s in identity curriculum practice review assessment coach; do
            psql -v ON_ERROR_STOP=1 -d xlearn_store \
              -c "CREATE ROLE xlearn_$s LOGIN PASSWORD 'pw'" \
              -c "CREATE SCHEMA $s AUTHORIZATION xlearn_$s" \
              -c "ALTER ROLE xlearn_$s SET search_path = $s"
          done
          for s in identity curriculum practice review assessment coach; do
            XLEARN_TEST_DATABASE_URL="postgres://xlearn_$s:pw@localhost:5432/xlearn_store?sslmode=disable" \
              go test -race -count=1 "./internal/$s/store/"
          done
          # The identity admin CLI (m1-04) against the same schema and role.
          XLEARN_TEST_DATABASE_URL="postgres://xlearn_identity:pw@localhost:5432/xlearn_store?sslmode=disable" \
            go test -race -count=1 ./internal/identity/admin/
      - name: Core-loop e2e (real embedded NATS JetStream + outbox)
        env:
          XLEARN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/xlearndb?sslmode=disable
        run: go test -tags e2e -race -count=1 ./internal/e2e/...
