name: deploy

# Publish service images to GHCR on push to main. Each service builds only when
# its own code (or shared code) changes — path-filtered, per ADR-0009. The
# reusable workflow tags images with a build semver (0.1.<run>); Flux
# image-automation (ImagePolicy range >=0.1.0) picks them up and deploys them to
# the k3s cluster (sujaykumarsuman/infra). Switch to release tags at 1.0.
on:
  push:
    branches: [main]

jobs:
  # Detect which services changed so only those rebuild.
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      identity: ${{ steps.filter.outputs.identity }}
      curriculum: ${{ steps.filter.outputs.curriculum }}
      practice: ${{ steps.filter.outputs.practice }}
      review: ${{ steps.filter.outputs.review }}
      assessment: ${{ steps.filter.outputs.assessment }}
      coach: ${{ steps.filter.outputs.coach }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'cmd/gateway/**'
              - 'internal/gateway/**'
              - 'internal/platform/**'
              - 'web/**'
              - 'embed.go'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/gateway.Dockerfile'
              - '.github/workflows/deploy.yml'
            identity:
              - 'cmd/identity/**'
              - 'internal/identity/**'
              - 'internal/platform/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/identity.Dockerfile'
              - '.github/workflows/deploy.yml'
            curriculum:
              - 'cmd/curriculum/**'
              - 'internal/curriculum/**'
              - 'internal/platform/**'
              - 'curriculum/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/curriculum.Dockerfile'
              - '.github/workflows/deploy.yml'
            practice:
              - 'cmd/practice/**'
              - 'internal/practice/**'
              - 'internal/platform/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/practice.Dockerfile'
              - '.github/workflows/deploy.yml'
            review:
              - 'cmd/review/**'
              - 'internal/review/**'
              - 'internal/platform/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/review.Dockerfile'
              - '.github/workflows/deploy.yml'
            assessment:
              - 'cmd/assessment/**'
              - 'internal/assessment/**'
              - 'internal/platform/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/assessment.Dockerfile'
              - '.github/workflows/deploy.yml'
            coach:
              - 'cmd/coach/**'
              - 'internal/coach/**'
              - 'internal/platform/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/coach.Dockerfile'
              - '.github/workflows/deploy.yml'

  gateway:
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' }}
    # The reusable workflow pushes to GHCR, so the calling job must grant
    # packages: write (this repo's default workflow token is read-only). Scoped
    # to this job rather than flipping the repo-wide default.
    permissions:
      contents: read
      packages: write
    uses: sujaykumarsuman/.github/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/sujaykumarsuman/xlearn-gateway
      dockerfile: deploy/gateway.Dockerfile
      # Stamp the binary version to match the build-semver image tag
      # (0.1.<run_number>) the reusable workflow publishes on a branch push.
      build-args: |
        VERSION=0.1.${{ github.run_number }}

  identity:
    needs: changes
    if: ${{ needs.changes.outputs.identity == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: sujaykumarsuman/.github/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/sujaykumarsuman/xlearn-identity
      dockerfile: deploy/identity.Dockerfile
      build-args: |
        VERSION=0.1.${{ github.run_number }}

  curriculum:
    needs: changes
    if: ${{ needs.changes.outputs.curriculum == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: sujaykumarsuman/.github/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/sujaykumarsuman/xlearn-curriculum
      dockerfile: deploy/curriculum.Dockerfile
      build-args: |
        VERSION=0.1.${{ github.run_number }}

  practice:
    needs: changes
    if: ${{ needs.changes.outputs.practice == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: sujaykumarsuman/.github/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/sujaykumarsuman/xlearn-practice
      dockerfile: deploy/practice.Dockerfile
      build-args: |
        VERSION=0.1.${{ github.run_number }}

  review:
    needs: changes
    if: ${{ needs.changes.outputs.review == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: sujaykumarsuman/.github/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/sujaykumarsuman/xlearn-review
      dockerfile: deploy/review.Dockerfile
      build-args: |
        VERSION=0.1.${{ github.run_number }}

  assessment:
    needs: changes
    if: ${{ needs.changes.outputs.assessment == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: sujaykumarsuman/.github/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/sujaykumarsuman/xlearn-assessment
      dockerfile: deploy/assessment.Dockerfile
      build-args: |
        VERSION=0.1.${{ github.run_number }}

  coach:
    needs: changes
    if: ${{ needs.changes.outputs.coach == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: sujaykumarsuman/.github/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/sujaykumarsuman/xlearn-coach
      dockerfile: deploy/coach.Dockerfile
      build-args: |
        VERSION=0.1.${{ github.run_number }}
