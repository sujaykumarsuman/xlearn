name: deploy

# Publish the gateway image to GHCR on push to main. The reusable workflow tags
# the image with a build semver (0.<run>.x, like projects-hub/landscape); Flux
# image-automation (ImagePolicy range >=0.1.0) picks it up and deploys it to the
# k3s cluster (sujaykumarsuman/infra). Switch to release tags at the 1.0
# milestone — see docs/adr/0009-deployment-and-gitops.md.
on:
  push:
    branches: [main]

jobs:
  gateway:
    uses: sujaykumarsuman/.github/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/sujaykumarsuman/xlearn-gateway
      dockerfile: deploy/gateway.Dockerfile
    secrets: inherit
