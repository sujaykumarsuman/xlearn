        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [coach]
      operationId: deleteCoachKey
      summary: Remove one provider's key (promotes a survivor to default if needed).
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string, enum: [openai, anthropic] }
      responses:
        "204": { description: Key removed. }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /coach/thread:
    get:
      tags: [coach]
      operationId: coachThread
      summary: Thread history for a page context.
      parameters:
        - { name: context, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The thread messages for the context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoachThread" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /coach/chat:
    post:
      tags: [coach]
      operationId: coachChat
      summary: Send a message with page context; streams the coach reply (SSE).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoachChatRequest" }
      responses:
        "200":
          description: |
            An SSE stream (`text/event-stream`). Each `data:` frame carries
            `{"delta":"…"}`; a terminal `event: done` carries
            `{"done":true,"truncated":bool}` (`truncated` when the provider cut the reply
            off at its length limit — the reply then ends with a visible note); a
            mid-stream failure is `event: error` with `{"error","message"}`, where
            `error` is `provider_auth` (key rejected and disabled), `provider_limited`
            (provider account out of credit or limited; key kept), or `provider_error`.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            No usable key: `no_key`, `key_disabled`, or `provider_auth` (the provider
            rejected the key before any byte was streamed; the key is now disabled).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          description: |
            `provider_limited`: the provider account is out of credit or over a quota,
            spend, or rate limit, or can't use the model/region. The key stays enabled;
            top up and retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example: { error: { code: provider_limited, message: "your provider account is out of credit or limited — top up and retry" } }
        "502": { $ref: "#/components/responses/BadGateway" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: xl_session
      description: HttpOnly session cookie set by the OAuth callback.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: The course slug (resolved against the compiled-in course manifests).
      schema: { type: string }
    ConceptSlug:
      name: c
      in: path
      required: true
      description: The concept slug within the course.
      schema: { type: string }
    ProblemID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [github, google] }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: No/invalid session; the SPA redirects to OAuth.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: unauthenticated } }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Conflicting state (e.g. no active attempt, already solved).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    CourseNotFound:
      description: |
        Unknown or retired course, a coming_soon course's data route, a preview course
        outside the cohort, or a resource that doesn't exist — one uniform envelope, so a
        response never hints whether a hidden course exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: course_not_found, message: no such course } }
    CourseNotAvailable:
      description: The course exists but can't be started (coming_soon or retired).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: course_not_available } }
    Unprocessable:
      description: Semantically invalid (e.g. bad outcome/category/rubric value).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    BadGateway:
      description: An upstream service failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { error: { code: upstream, message: review unavailable } }
    Unavailable:
      description: A required upstream is not configured.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string }
        message: { type: string }
        details: {}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }
    Difficulty:
      type: string
      enum: [easy, med, hard]
    Outcome:
      type: string
      enum: [clean, rough, assisted, miss]
    Account:
      type: object
      properties:
        id: { type: string }
        display_name: { type: string }
        email: { type: [string, "null"] }
        username: { type: string, description: URL-safe public handle powering /xlearn/u/<username> and username sign-in (F009). Omitted until claimed. }
        timezone: { type: string }
        has_password: { type: boolean, description: True when an email/password sign-in is set (ADR-0023). }
        linked_providers: { type: array, items: { type: string }, description: OAuth providers linked to the account. }
        study_budget: { type: object }
        reminders: { type: object }
        created_at: { type: string, format: date-time }
    PublicProfile:
      type: object
      description: Public user dashboard payload (F009 / ADR-0024) — non-PII aggregates only.
      properties:
        user:
          type: object
          properties:
            username: { type: string }
            displayName: { type: string }
            joinedAt: { type: string, format: date-time }
            region: { type: string, description: "Coarse UTC-offset band (e.g. UTC+05:30) — never the IANA zone/city (F009)." }
        totals:
          type: object
          properties:
            solved: { type: integer }
            streak:
              type: object
              properties:
                current: { type: integer }
                longest: { type: integer }
        mock:
          type: object
          properties:
            count: { type: integer }
            best: { type: integer }
            average: { type: integer }
        heatmap:
          type: [object, "null"]
          description: "{ days: [{date, solves, reviews}] } merged across courses, or null when the projection is unavailable."
        courses:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              title: { type: string }
              solved: { type: integer }
              total: { type: integer }
              pct: { type: integer }
              phases: { type: array, items: { type: object } }
              patterns: { type: array, items: { type: object } }
    EmailAuthRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, description: "On signup an email address; on login an email OR username (F009)." }
        password: { type: string, minLength: 8, maxLength: 72 }
    SetUsernameRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, description: "Lowercase slug, 3–30 chars; letters/digits/hyphens; not a reserved word (F009 / ADR-0024)." }
    SetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        current_password: { type: string, description: Required when the account already has a password; omitted when setting one for the first time. }
        new_password: { type: string, minLength: 8, maxLength: 72 }
    Onboarding:
      type: object
      properties:
        path_chosen: { type: [string, "null"] }
        budget_set: { type: boolean }
        completed: { type: boolean }
    Enrollment:
      type: object
      description: A learner's per-path enrollment (F002). started_at anchors "current day".
      properties:
        path_slug: { type: string }
        status: { type: string, enum: [active, paused] }
        started_at: { type: string, format: date-time }
    MeResponse:
      type: object
      properties:
        account: { $ref: "#/components/schemas/Account" }
        onboarding: { $ref: "#/components/schemas/Onboarding" }
        enrollments:
          type: array
          items: { $ref: "#/components/schemas/Enrollment" }
    PatchMeRequest:
      type: object
      description: Partial update; server fields (id/email/created_at) are accepted and ignored.
      properties:
        display_name: { type: string }
        timezone: { type: string, description: IANA zone. }
        study_budget:
          type: object
          properties:
            weekday_minutes: { type: integer, minimum: 30, maximum: 240 }
            weekend_band: { type: string, enum: ["2", "3-4", "5"] }
        reminders:
          type: object
          properties:
            daily_reminder_on: { type: boolean }
            daily_reminder_time: { type: string, description: "HH:MM" }
            revision_due_alerts_on: { type: boolean }
    OnboardingStepRequest:
      type: object
      required: [step]
      properties:
        step: { type: string, enum: [path, budget, finish] }
        path_chosen: { type: string }
        study_budget: { type: object }
    PathSummary:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        status: { type: string, enum: [active, coming_soon, preview] }
        summary: { type: string }
        problem_total: { type: integer }
        week_total: { type: integer }
        course: { $ref: "#/components/schemas/CourseView" }
    CourseView:
      type: object
      description: |
        The learner-safe view of the course manifest (m1-03; internal/course/view.go):
        presentation data only — nothing answer-bearing.
      properties:
        slug: { type: string }
        title: { type: string }
        status: { type: string }
        short_code: { type: string, description: "The selector badge (DSA, …)." }
        nav:
          type: object
          properties:
            item_noun: { type: string }
            groups:
              type: array
              items:
                type: object
                properties:
                  cap: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        screen: { type: string, enum: [today, roadmap, problems, progress, revision, mistakes, mock] }
                        label: { type: string }
        stages:
          type: object
          properties:
