      type: object
      properties:
        provider: { type: string, enum: [openai, anthropic] }
        masked_key: { type: string }
        default_model: { type: string }
        name: { type: string, description: Display name for this coach (defaults to the model id). }
        enabled: { type: boolean }
        is_default: { type: boolean, description: True for the provider the coach answers with. }
    CoachKeyList:
      type: object
      properties:
        keys: { type: array, items: { $ref: "#/components/schemas/CoachKey" } }
        connected: { type: boolean }
        default_provider: { type: string, description: The default provider id, or "" when none connected. }
    CoachKeyRequest:
      type: object
      description: >-
        Every mode is keyed to a `provider`. Modes: (1) store/replace — `provider` + `key`
        (+ `default_model`, `name`); (2) set default — `provider` + `default: true`;
        (3) toggle — `provider` + `enabled`; (4) meta update — `provider` + `default_model`
        and/or `name` (no `key`) to change the model/name in place. An account may connect one
        key per provider; the first becomes the default.
      required: [provider]
      properties:
        provider: { type: string, enum: [openai, anthropic] }
        key: { type: string, description: Present → store/replace this provider's key. Omit for the other modes. }
        default: { type: boolean, description: True → make this provider the account's default. }
        default_model: { type: string }
        name: { type: string, description: Display name for this coach (defaults to the model id). }
        enabled: { type: boolean }
    CoachThread:
      type: object
      properties:
        context: { type: string }
        messages:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              content: { type: string }
              createdAt: { type: string, format: date-time }
    CoachChatRequest:
      type: object
      required: [context, message]
      properties:
        context: { type: string, description: 'e.g. "problem:16"' }
        message: { type: string }
        kind: { type: string }
        label: { type: string }
        problemId: { type: string, description: Non-authoritative; the gateway rewrites it from practice state. }
        problemTitle: { type: string }
        pattern: { type: string }
        stage: { type: string }
        weakArea: { type: string }
        recentOutcome: { type: string }
