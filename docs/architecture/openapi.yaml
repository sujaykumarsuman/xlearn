# xLearn BFF API — OpenAPI 3.1 contract.
#
# GENERATED-CONTRACT: this file is the machine-readable form of the gateway's public
# surface (the human table lives in api.md). It is kept in lock-step with the route
# table in internal/gateway/bff.go (apiRoutes) by a CI drift check
# (internal/gateway/openapi_drift_test.go): adding or removing a gateway route without
# updating this file fails the build. Request/response schemas are authored by hand
# because the gateway composes several of them from map[string]json.RawMessage
# (aggregations), which no struct-reflection generator can introspect (ADR-0021).
#
# Not listed here (served outside the /xlearn/api surface): the k8s probes GET /healthz
# and GET /readyz at the pod root, GET /api/healthz (app health), and the public
# GET /.well-known/jwks.json (JWKS verification keys). See api.md.
openapi: 3.1.0
info:
  title: xLearn BFF API
  version: 1.0.0
  description: |
    The only public xLearn API — the gateway's BFF, same-origin with the SPA at
    `projects.sujaykumar.dev/xlearn/api/v1` (cookie auth, no CORS). The unversioned
    `/xlearn/api` prefix is kept as a compat alias (ADR-0021).

    **Auth.** An HttpOnly `Secure` `SameSite=Lax` session cookie (`xl_session`). The
    SPA sends it with `credentials: include`. Unauthenticated requests get `401` with
    `{"error":{"code":"unauthenticated"}}`, on which the SPA redirects to OAuth. The
    gateway validates the session against identity and mints a short-TTL RS256 JWT per
    downstream audience (ADR-0006); clients never see it.

    **Errors.** Every error is the envelope `{"error":{"code","message"?,"details"?}}`;
    the HTTP status reflects the class (`400/401/403/404/409/422/429/5xx`). A failed
    upstream is `502 {"error":{"code":"upstream"}}`; an unconfigured one is `503`.

    **Aggregations.** Endpoints marked `agg` fan out to several services server-side
    (Week, Problem, Dashboard, Progress). Each degrades a section independently rather
    than failing the whole response, except `GET /progress`, whose summary leg is
    required.

    **Courses (m1-03).** Course-scoped routes live under `/paths/{slug}/…`; `{slug}` is
    resolved against the course manifests compiled into the gateway. An unknown or
    retired course, a `coming_soon` course's data routes and a `preview` course outside
    the owner/tester cohort all get the same `404 {"error":{"code":"course_not_found"}}`.
    Items keep global ids (`/problems/{id}`, `/revision/{itemId}/score`,
    `/mistakes/{id}`, `/mocks/{id}`); their course is the item's `path_slug`. The v1 routes
    without a course (`/dashboard`, `/progress`, `/revision/due`, `/mistakes`,
    `/weak-area`, `/mocks`, `/mocks/trend`, `/concepts/{slug}`) are **deprecated DSA
    aliases**, byte-identical to `/paths/dsa/…`; the SPA stops calling them in v1.7.0 and
    they are removed no earlier than v1.9.0 (ADR-0034 §1.1).

    **Streaming.** `POST /coach/chat` responds `text/event-stream` (SSE): `data:` frames
    carrying `{"delta"}`, a terminal `event: done`, or `event: error` on a mid-stream
    failure. Errors before the first byte are the normal JSON envelope.
servers:
  - url: /xlearn/api/v1
    description: The 1.0 API surface (same origin as the SPA).
  - url: /xlearn/api
    description: Unversioned compat alias — the gateway serves it identically to /xlearn/api/v1 (ADR-0021).
tags:
  - name: account
  - name: curriculum
  - name: problem
  - name: revision
  - name: mistakes
  - name: mock
  - name: progress
  - name: coach

security:
  - cookieAuth: []

paths:
  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: Current account + onboarding state.
      responses:
        "200":
          description: The caller's account and onboarding state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      tags: [account]
      operationId: patchMe
      summary: Update profile / study budget / timezone / reminders.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchMeRequest" }
      responses:
        "200":
          description: The updated account + onboarding state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/password:
    post:
      tags: [account]
      operationId: setPassword
      summary: Set or change the account password (ADR-0023). OAuth-only accounts set it without a current password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPasswordRequest" }
      responses:
        "200": { description: Password set/changed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/oauth/{provider}:
    delete:
      tags: [account]
      operationId: unlinkOAuth
      summary: Disconnect a linked provider (never the account's last sign-in method).
      parameters:
        - { $ref: "#/components/parameters/Provider" }
      responses:
        "204": { description: Provider disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Cannot remove the last sign-in method — set a password first. }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /me/username:
    post:
      tags: [account]
      operationId: setUsername
      summary: Claim or change the account's public username (F009 / ADR-0024).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetUsernameRequest" }
      responses:
        "200":
          description: Username claimed/changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  username: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: That username is already taken. }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /username/available:
    get:
      tags: [account]
      operationId: usernameAvailable
      summary: Live availability + validity check for a candidate username (F009).
      parameters:
        - { name: u, in: query, required: true, schema: { type: string }, description: The candidate username. }
      responses:
        "200":
          description: Availability result (a malformed/reserved name reports available=false with a reason, not an error).
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  reason: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /onboarding/step:
    post:
      tags: [account]
      operationId: onboardingStep
      summary: Advance the 3-step onboarding (path → budget → finish).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingStepRequest" }
      responses:
        "200":
          description: The updated onboarding state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboarding: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/logout:
    post:
      tags: [account]
      operationId: logout
      summary: Revoke the session and clear the cookie (idempotent).
      security: []
      responses:
        "204": { description: Session revoked; cookie cleared. }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/signup:
    post:
      tags: [account]
      operationId: signup
      summary: Create an email/password account + session (ADR-0023). No email verification yet. 403 while SIGNUP_MODE is closed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailAuthRequest" }
      responses:
        "200": { description: Account created; session cookie set. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Sign-up is closed (`signup_closed`); checked before the body is read." }
        "409": { description: An account with this email already exists. }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/login:
    post:
      tags: [account]
      operationId: login
      summary: Email/password sign-in; sets a session cookie (ADR-0023). Uniform 401 on failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailAuthRequest" }
      responses:
        "200": { description: Signed in; session cookie set. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/{provider}/start:
    post:
      tags: [account]
      operationId: authStart
      summary: Begin OAuth; 302 to the provider. `link=1` connects the provider to the signed-in account.
      security: []
      parameters:
        - { $ref: "#/components/parameters/Provider" }
        - name: link
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
          description: When "1", link the provider to the current session's account (Settings → Connect).
      responses:
        "302": { description: Redirect to the OAuth provider (sets an oauth-tx cookie). }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/{provider}/callback:
    get:
      tags: [account]
      operationId: authCallback
      summary: OAuth callback; sets the session cookie and 302s into the app.
      security: []
      parameters:
        - { $ref: "#/components/parameters/Provider" }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: "Redirect into the SPA (sets xl_session on success). Failures land on /auth?error=<code>, e.g. `signup_closed` (no account, sign-up closed) or `account_exists_password` (the email belongs to a password account; not auto-linked)." }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths:
    get:
      tags: [curriculum]
      operationId: listPaths
      summary: Catalog — the courses this caller may see, with status and the learner-safe course view.
      description: |
        Active courses, `coming_soon` teasers (catalog only: their data routes 404) and, for
        the owner/tester cohort only, `preview` courses (m1-04; hidden from everyone in
        v1.7.0). Retired courses never appear. Each entry carries its `course` view.
      responses:
        "200":
          description: The session-gated catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paths:
                    type: array
                    items: { $ref: "#/components/schemas/PathSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}:
    get:
      tags: [curriculum]
      operationId: getPath
      summary: Roadmap — phases, weeks, totals (and the course view in path.course).
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      responses:
        "200":
          description: The path roadmap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Roadmap" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}/problems:
    get:
      tags: [curriculum]
      operationId: listPathProblems
      summary: The whole problem index for a path (the Problems arena — browse + attempt any).
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      responses:
        "200":
          description: Every problem in the path (id, title, difficulty, pattern, week, reinforcement).
          content:
            application/json:
              schema:
                type: object
                properties:
                  problems:
                    type: array
                    items: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}/weeks/{n}:
    get:
      tags: [curriculum]
      operationId: getWeek
      summary: Week thesis + concepts + problems with the user's five-touch state (agg).
      parameters:
        - { $ref: "#/components/parameters/Slug" }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Week content with the injected per-user `userState` block.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeekView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}/concepts/{c}:
    get:
      tags: [curriculum]
      operationId: getCourseConcept
      summary: A course's concept reading + code template (keyed on course and concept slug).
      parameters:
        - { $ref: "#/components/parameters/Slug" }
        - { $ref: "#/components/parameters/ConceptSlug" }
      responses:
        "200":
          description: The concept.
          content:
            application/json:
              schema:
                type: object
                properties:
                  concept: { $ref: "#/components/schemas/Concept" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}/dashboard:
    get:
      tags: [progress]
      operationId: getCourseDashboard
      summary: A course's "Today" — daily plan, due reviews, weak area, streak, stats (agg).
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      responses:
        "200":
          description: The composed dashboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}/progress:
    get:
      tags: [progress]
      operationId: getCourseProgress
      summary: A course's coverage, heatmap, mastery, rubric trend, outcome mix (agg).
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      responses:
        "200":
          description: The composed progress view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}/revision/due:
    get:
      tags: [revision]
      operationId: courseRevisionDue
      summary: A course's prioritised due queue, enriched with problem metadata (agg).
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      responses:
        "200":
          description: The due queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DueQueue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}/mistakes:
    get:
      tags: [mistakes]
      operationId: listCourseMistakes
      summary: A course's mistake journal, each entry enriched with problem metadata (agg).
      parameters:
        - { $ref: "#/components/parameters/Slug" }
        - name: status
          in: query
          schema: { type: string, enum: [open, closed] }
      responses:
        "200":
          description: The journal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MistakeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [mistakes]
      operationId: createCourseMistake
      summary: Create a journal entry in this course (root cause, insight, category).
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MistakeCreateRequest" }
      responses:
        "201":
          description: The created entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mistake" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}/weak-area:
    get:
      tags: [mistakes]
      operationId: courseWeakArea
      summary: A course's current weekly weak-area banner (agg).
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      responses:
        "200":
          description: The weak-area rollup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeakArea" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}/mocks:
    post:
      tags: [mock]
      operationId: startCourseMock
      summary: Start a mock in this course (setup → session).
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MockStartRequest" }
      responses:
        "201":
          description: The live mock session view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}/mocks/trend:
    get:
      tags: [mock]
      operationId: courseMockTrend
      summary: A course's scored mock history vs the readiness targets.
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      responses:
        "200":
          description: The trend points + targets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockTrend" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /paths/{slug}/start:
    post:
      tags: [curriculum]
      operationId: startPath
      summary: Enroll the caller in a course (idempotent) — sets the start date for "current day".
      description: |
        Only an `active` course can be started (ADR-0033 §12 row 8): an unknown course, or a
        `preview` one outside the cohort, is `404 course_not_found`; a `coming_soon` or
        `retired` course is `409 course_not_available`.
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      responses:
        "200":
          description: The caller's enrollment on this course.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollment: { $ref: "#/components/schemas/Enrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CourseNotFound" }
        "409": { $ref: "#/components/responses/CourseNotAvailable" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /concepts/{slug}:
    get:
      tags: [curriculum]
      operationId: getConcept
      deprecated: true
      description: DSA alias of `/paths/dsa/concepts/{c}` (m1-03, ADR-0034 §1.1) — byte-identical; kept for open v1.6.0 tabs, removed no earlier than v1.9.0.
      summary: Concept reading + code template.
      parameters:
        - { $ref: "#/components/parameters/Slug" }
      responses:
        "200":
          description: The concept.
          content:
            application/json:
              schema:
                type: object
                properties:
                  concept: { $ref: "#/components/schemas/Concept" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /problems/{id}:
    get:
      tags: [problem]
      operationId: getProblem
      summary: Problem + only the unlocked stage sections + user state + timer (agg).
      parameters:
        - { $ref: "#/components/parameters/ProblemID" }
      responses:
        "200":
          description: Problem content filtered to unlocked stages, plus practice state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /problems/{id}/attempt/start:
    post:
      tags: [problem]
      operationId: startAttempt
      summary: Start/resume the attempt; starts the 15-min server timer.
      parameters:
        - { $ref: "#/components/parameters/ProblemID" }
      responses:
        "200":
          description: The updated practice state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { $ref: "#/components/schemas/PracticeState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /problems/{id}/reveal:
    post:
      tags: [problem]
      operationId: reveal
      summary: Reveal hint/solution; returns the penalty ack if solution revealed early.
      parameters:
