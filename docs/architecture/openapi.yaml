      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          properties:
            contract_hash_prefix:
              type: string
              description: First 12 hex chars of the item's contract_hash (humans see a prefix); empty on the self path.
            grading_summary:
              type: object
              description: How the item is graded, derived at seed. A self-path item is just {"mode":"self"}.
              properties:
                mode: { type: string, enum: [self, auto, mixed] }
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      type: { type: string }
                      grading: { type: string, enum: [auto, ai, none] }
                      cadence: { type: string, enum: [iterate, final] }
                grader_kinds: { type: array, items: { type: string } }
                languages: { type: array, items: { type: string } }
